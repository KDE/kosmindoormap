Dependencies:
- 'on': ['Linux', 'FreeBSD', 'Windows', 'Android']
  'require':
    'frameworks/extra-cmake-modules': 'Frameworks/6.24'
    'frameworks/ki18n': 'Frameworks/6.24'
    'frameworks/kirigami': 'Frameworks/6.24'
    'frameworks/kcontacts': 'Frameworks/6.24'
    'libraries/kpublictransport': "@same"
    'libraries/kopeninghours': "@same"
    'libraries/kirigami-addons': "v1.11.0"

- 'on': ['Linux', 'FreeBSD', 'Windows']
  'require':
    'frameworks/kservice': 'Frameworks/6.24'

Options:
  cmake-options: "-DBUILD_STANDALONE_APP=ON"
  require-passing-tests-on: [ 'Linux', 'FreeBSD', 'Windows' ]
  run-qmllint: true
